<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do Application</title>
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="header">
      <h1 class="htext">
        Personal Notebook
        <button class="hbtn">Transport Attributes</button>
      </h1>
    </div>

    <div class="left-box">
      <h3 class="sidebar-title">System Landscape</h3>

      <div class="systemname">
        <input type="text" id="systeminput" placeholder="Add system name..." />
        <button id="addbtn">+</button>
      </div>

      <ul class="sysland" id="sys-land"></ul>
    </div>

    <button class="lbtn">Left Button</button>

    <main class="content">
      <h2 class="content-title">Transport Requests</h2>

      <div class="main-panel">
        <ul class="mainlist" id="main-list"></ul>

        <div class="mainname">
          <span class="plus" aria-hidden="true">+</span>
          <input
            type="text"
            id="maininput"
            placeholder="Add a task and press Enter"
          />
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
